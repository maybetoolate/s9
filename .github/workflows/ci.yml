name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: s9
          POSTGRES_PASSWORD: s9
          POSTGRES_DB: s9
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U s9 -d s9"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: test
      DATABASE_URL: postgres://s9:s9@localhost:5432/s9
      DATABASE_URL_TEST: postgres://s9:s9@localhost:5432/s9_test
      DATABASE_ADMIN_URL: postgres://s9:s9@localhost:5432/postgres
      REDIS_URL: redis://localhost:6379
      SESSION_SECRET: ci-session-secret-at-least-32-characters-long
      ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      ENCRYPTION_KEY_ID: key-1
      EMAIL_PROVIDER: mailpit
      MAILPIT_URL: http://localhost:8025

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Apply migrations to an empty database
        run: pnpm --filter @s9/server db:migrate
        env:
          DATABASE_URL: postgres://s9:s9@localhost:5432/s9

      - name: Unit tests
        run: pnpm --filter @s9/server test:unit

      - name: Integration tests
        run: pnpm --filter @s9/server test:integration

      - name: Build
        run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: '1'

  neovim:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable

      - name: Test the Neovim plugin
        run: nvim --headless --clean -u NONE -l packages/neovim/tests/run.lua
