name: s9

services:
  # A local sink for the demo workflow. It accepts the notification delivery
  # and answers with 200, so the demo completes without an external service.
  sink:
    image: nginx:stable-alpine
    volumes:
      - ./docker/sink/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8080"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: s9
      POSTGRES_PASSWORD: s9
      POSTGRES_DB: s9
    ports:
      - "55432:5432"
    volumes:
      # PostgreSQL 18 stores its data under /var/lib/postgresql/<major>, so the
      # volume is mounted at the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s9 -d s9"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real-time web log viewer for every container in this project.
  # Open http://localhost:8080 to search, filter by container and follow logs.
  # The Docker socket is mounted read-only: Dozzle can only read logs.
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
    environment:
      # Only show the containers that belong to this Compose project.
      DOZZLE_FILTER: label=com.docker.compose.project=s9
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: "300"
      DOZZLE_NO_ANALYTICS: "true"
    restart: unless-stopped

  # Local mail catcher for the email action. The messages can be inspected at
  # http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # The HTTP API and web UI.
      - "8025:8025"
      # SMTP. The host port is 1026 so it does not clash with a local SMTP server.
      - "1026:1025"

  # Authentication owns the Better-Auth tables and the session protocol. The
  # API and the web app reach it over the internal network; its port is not
  # published to the host.
  auth:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "packages/server/dist/main-auth.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      # The shared environment contract requires these even though the auth
      # service itself does not use the queue or the encryption key.
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      AUTH_PORT: "4001"
      AUTH_HOST: 0.0.0.0
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-s9-api}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-s9-api-local-service-secret}
      AUTH_CLIENT_SCOPES: users:read sessions:validate
      AUTH_SERVICE_TOKEN_TTL: "300"
      AUTH_API_RESOURCE: ${AUTH_API_RESOURCE:-urn:s9:api}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: ["node", "packages/server/dist/main-api.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4100}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      AUTH_INTERNAL_URL: http://auth:4001
      AUTH_CLIENT_ID: ${AUTH_CLIENT_ID:-s9-api}
      AUTH_CLIENT_SECRET: ${AUTH_CLIENT_SECRET:-s9-api-local-service-secret}
      AUTH_CLIENT_SCOPES: users:read sessions:validate
      AUTH_API_RESOURCE: ${AUTH_API_RESOURCE:-urn:s9:api}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      MAILPIT_URL: http://mailpit:8025
      ALLOWED_PRIVATE_HOSTS: sink,mailpit,localhost,127.0.0.1
      DEMO_NOTIFICATION_URL: http://sink:8080/notify
    ports:
      - "4100:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth:
        condition: service_started

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["node", "packages/server/dist/main-worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      MAILPIT_URL: http://mailpit:8025
      ALLOWED_PRIVATE_HOSTS: sink,mailpit,localhost,127.0.0.1
      DEMO_NOTIFICATION_URL: http://sink:8080/notify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
    command: ["node", "packages/server/dist/main-scheduler.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      MAILPIT_URL: http://mailpit:8025
      ALLOWED_PRIVATE_HOSTS: sink,mailpit,localhost,127.0.0.1
      DEMO_NOTIFICATION_URL: http://sink:8080/notify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    command: ["node", "packages/web/server.js"]
    environment:
      NODE_ENV: production
      # The proxy resolves the address of the API when a request arrives.
      API_INTERNAL_URL: http://api:4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4100}
      BETTER_AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres-data:
  redis-data:
