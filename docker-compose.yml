name: s9

# Watch lists for `docker compose watch`.
#
# The images run compiled output, so a source change rebuilds the image
# instead of syncing a file the process would never load. BuildKit's layer
# cache keeps the rebuild cheap.
x-watch-server: &watch-server
  - action: rebuild
    path: packages/server/src
  - action: rebuild
    path: packages/server/migrations
  - action: rebuild
    path: packages/server/package.json
  - action: rebuild
    path: packages/core/src
  - action: rebuild
    path: packages/core/package.json
  - action: rebuild
    path: package.json
  - action: rebuild
    path: pnpm-lock.yaml
  - action: rebuild
    path: pnpm-workspace.yaml
  - action: rebuild
    path: tsconfig.base.json

x-watch-web: &watch-web
  - action: rebuild
    path: packages/web/src
  - action: rebuild
    path: packages/web/public
  - action: rebuild
    path: packages/web/package.json
  - action: rebuild
    path: packages/web/next.config.ts
  - action: rebuild
    path: packages/web/postcss.config.mjs
  - action: rebuild
    path: packages/web/tsconfig.json
  - action: rebuild
    path: packages/core/src
  - action: rebuild
    path: packages/core/package.json
  - action: rebuild
    path: package.json
  - action: rebuild
    path: pnpm-lock.yaml
  - action: rebuild
    path: pnpm-workspace.yaml
  - action: rebuild
    path: tsconfig.base.json

services:
  # A local sink for the demo workflow. It accepts the notification delivery
  # and answers with 200, so the demo completes without an external service.
  sink:
    image: nginx:stable-alpine
    volumes:
      - ./docker/sink/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:8080"

  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: s9
      POSTGRES_PASSWORD: s9
      POSTGRES_DB: s9
    ports:
      - "55432:5432"
    volumes:
      # PostgreSQL 18 stores its data under /var/lib/postgresql/<major>, so the
      # volume is mounted at the parent directory.
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U s9 -d s9"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "56379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Real-time web log viewer for every container in this project.
  # Open http://localhost:8080 to search, filter by container and follow logs.
  # The Docker socket is mounted read-only: Dozzle can only read logs.
  dozzle:
    image: amir20/dozzle:latest
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    ports:
      - "8080:8080"
    environment:
      # Only show the containers that belong to this Compose project.
      DOZZLE_FILTER: label=com.docker.compose.project=s9
      DOZZLE_LEVEL: info
      DOZZLE_TAILSIZE: "300"
      DOZZLE_NO_ANALYTICS: "true"
    restart: unless-stopped

  # Local mail catcher for the email action. The messages can be inspected at
  # http://localhost:8025
  mailpit:
    image: axllent/mailpit:latest
    ports:
      # The HTTP API and web UI.
      - "8025:8025"
      # SMTP. The host port is 1026 so it does not clash with a local SMTP server.
      - "1026:1025"

  # Authentication is embedded in the API as a module; there is no separate
  # auth container. The API owns the Better-Auth tables and serves the public
  # `/api/auth/*` surface.

  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-oven/bun:1-alpine}
        RUNTIME_BIN: ${RUNTIME_BIN:-bun}
    command: ["${RUNTIME_BIN:-bun}", "packages/server/dist/main-api.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      REDIS_URL: redis://redis:6379
      API_PORT: "4000"
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4100}
      WEB_PUBLIC_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      MAILPIT_URL: http://mailpit:8025
      ALLOWED_PRIVATE_HOSTS: sink,mailpit,localhost,127.0.0.1
      DEMO_NOTIFICATION_URL: http://sink:8080/notify
    ports:
      - "4100:4000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch: *watch-server

  worker:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-oven/bun:1-alpine}
        RUNTIME_BIN: ${RUNTIME_BIN:-bun}
    command: ["${RUNTIME_BIN:-bun}", "packages/server/dist/main-worker.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      WORKER_ID: worker-1
      WORKER_CONCURRENCY: ${WORKER_CONCURRENCY:-5}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      MAILPIT_URL: http://mailpit:8025
      ALLOWED_PRIVATE_HOSTS: sink,mailpit,localhost,127.0.0.1
      DEMO_NOTIFICATION_URL: http://sink:8080/notify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch: *watch-server

  scheduler:
    build:
      context: .
      dockerfile: docker/worker.Dockerfile
      args:
        RUNTIME_IMAGE: ${RUNTIME_IMAGE:-oven/bun:1-alpine}
        RUNTIME_BIN: ${RUNTIME_BIN:-bun}
    command: ["${RUNTIME_BIN:-bun}", "packages/server/dist/main-scheduler.js"]
    environment:
      NODE_ENV: production
      LOG_LEVEL: info
      DATABASE_URL: postgres://s9:s9@postgres:5432/s9
      REDIS_URL: redis://redis:6379
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:-Zm9vLWZsb3ctbG9jYWwtZW5jcnlwdGlvbi1rZXktMDAwMDA=}
      ENCRYPTION_KEY_ID: ${ENCRYPTION_KEY_ID:-key-1}
      SESSION_SECRET: ${SESSION_SECRET:-replace-me-with-a-32-character-random-string}
      EMAIL_PROVIDER: ${EMAIL_PROVIDER:-mailpit}
      MAILPIT_URL: http://mailpit:8025
      ALLOWED_PRIVATE_HOSTS: sink,mailpit,localhost,127.0.0.1
      DEMO_NOTIFICATION_URL: http://sink:8080/notify
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    develop:
      watch: *watch-server

  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    command: ["node", "packages/web/server.js"]
    environment:
      NODE_ENV: production
      # The proxy resolves the address of the API when a request arrives.
      API_INTERNAL_URL: http://api:4000
      API_PUBLIC_URL: ${API_PUBLIC_URL:-http://localhost:4100}
      BETTER_AUTH_URL: ${WEB_PUBLIC_URL:-http://localhost:3000}
    ports:
      - "3000:3000"
    depends_on:
      - api
    develop:
      watch: *watch-web

volumes:
  postgres-data:
  redis-data:
